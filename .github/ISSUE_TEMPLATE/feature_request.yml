name: Feature Request
description: Propose a new input field, output field, or discovery/enrichment source
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a new discovery or enrichment source? Read this Actor's compliance doctrine
        first (README → Enterprise Use Cases, and `package.json`'s description): no CAPTCHA-solving,
        no fingerprint spoofing, no WAF-bypass, and no Google Maps-derived discovery (its own
        Additional Terms and Maps Platform Terms prohibit building a business-listings database
        from Maps content). A source that requires any of these will be declined regardless of
        how valuable the data would be.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New discovery mode
        - New enrichment provider (BYOK)
        - New output field
        - Intent-scoring logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. discoveryMode, skipKnownLeads)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input & Output Schema)
          required: true
        - label: If this proposes a new discovery/enrichment source, I confirmed it's openly accessible (no login wall, no CAPTCHA, no registration gate) or is a legitimate BYOK vendor
          required: false
